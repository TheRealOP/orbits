[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit"
version = "0.1.0"
description = "Agent-team coordination service extending Symphony with multi-agent routing and AKMS knowledge integration"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "watchfiles>=0.21",
    "rich>=13.0",
    "click>=8.1",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "anyio[trio]",
]

[project.scripts]
orbit = "orbit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "anyio[trio]",
]
